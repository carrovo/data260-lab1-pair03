# Loads the SEED=3 demo data. Not part of the default deploy; run it once with
#   make k8s-seed
apiVersion: batch/v1
kind: Job
metadata:
  name: p03-seed
  namespace: p03
  labels: {app.kubernetes.io/name: p03-seed, app.kubernetes.io/part-of: p03}
spec:
  backoffLimit: 2
  template:
    metadata:
      labels: {app.kubernetes.io/name: p03-seed, app.kubernetes.io/part-of: p03}
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: p03-company-service:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "backend.seed_final_data"]
          envFrom:
            - configMapRef:
                name: p03-config
          env:
            - name: MYSQL_PASSWORD
              valueFrom: {secretKeyRef: {name: p03-secrets, key: MYSQL_PASSWORD}}
            - name: DATABASE_URL
              value: mysql+pymysql://p03_app:$(MYSQL_PASSWORD)@p03-mysql:3306/p03
            - name: JWT_SECRET_KEY
              valueFrom: {secretKeyRef: {name: p03-secrets, key: JWT_SECRET_KEY}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
