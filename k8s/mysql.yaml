apiVersion: v1
kind: Service
metadata:
  name: p03-mysql
  labels: {app.kubernetes.io/name: p03-mysql, app.kubernetes.io/part-of: p03}
spec:
  selector: {app.kubernetes.io/name: p03-mysql}
  ports:
    - {name: mysql, port: 3306, targetPort: 3306}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: p03-mysql
  labels: {app.kubernetes.io/name: p03-mysql, app.kubernetes.io/part-of: p03}
spec:
  serviceName: p03-mysql
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: p03-mysql}
  template:
    metadata:
      labels: {app.kubernetes.io/name: p03-mysql, app.kubernetes.io/part-of: p03}
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - {name: mysql, containerPort: 3306}
          env:
            - {name: MYSQL_DATABASE, value: p03}
            - {name: MYSQL_USER, value: p03_app}
            - name: MYSQL_PASSWORD
              valueFrom: {secretKeyRef: {name: p03-secrets, key: MYSQL_PASSWORD}}
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: p03-secrets, key: MYSQL_ROOT_PASSWORD}}
          readinessProbe:
            exec:
              command: ["sh", "-c", 'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent']
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 20
          livenessProbe:
            exec:
              command: ["sh", "-c", 'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent']
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/mysql, subPath: data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: {storage: 2Gi}
