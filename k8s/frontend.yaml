apiVersion: v1
kind: Service
metadata:
  name: p03-frontend
  labels:
    app.kubernetes.io/name: p03-frontend
    app.kubernetes.io/part-of: p03
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: p03-frontend
  ports:
    - name: http
      port: 9036
      targetPort: 9036
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p03-frontend
  labels:
    app.kubernetes.io/name: p03-frontend
    app.kubernetes.io/part-of: p03
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: p03-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: p03-frontend
        app.kubernetes.io/part-of: p03
    spec:
      containers:
        - name: frontend
          image: p03-frontend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9036
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
