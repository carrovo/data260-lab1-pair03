apiVersion: v1
kind: Service
metadata:
  name: p03-mongo
  labels: {app.kubernetes.io/name: p03-mongo, app.kubernetes.io/part-of: p03}
spec:
  selector: {app.kubernetes.io/name: p03-mongo}
  ports:
    - {name: mongo, port: 27017, targetPort: 27017}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: p03-mongo
  labels: {app.kubernetes.io/name: p03-mongo, app.kubernetes.io/part-of: p03}
spec:
  serviceName: p03-mongo
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: p03-mongo}
  template:
    metadata:
      labels: {app.kubernetes.io/name: p03-mongo, app.kubernetes.io/part-of: p03}
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - {name: mongo, containerPort: 27017}
          readinessProbe:
            exec:
              command: ["sh", "-c", "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' | grep -q 1"]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 20
          livenessProbe:
            exec:
              command: ["sh", "-c", "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' | grep -q 1"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /data/db}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: {storage: 2Gi}
