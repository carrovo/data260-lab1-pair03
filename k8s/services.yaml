# The three Pair 03 company-side services. Student, Application and Assistant
# belong to the student-side branch and are added when that branch is merged.
apiVersion: v1
kind: Service
metadata:
  name: p03-company-service
  labels:
    app.kubernetes.io/name: p03-company-service
    app.kubernetes.io/part-of: p03
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: p03-company-service
  ports:
    - name: http
      port: 9030
      targetPort: 9030
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p03-company-service
  labels:
    app.kubernetes.io/name: p03-company-service
    app.kubernetes.io/part-of: p03
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: p03-company-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: p03-company-service
        app.kubernetes.io/part-of: p03
    spec:
      containers:
        - name: company
          image: p03-company-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9030
          envFrom:
            - configMapRef:
                name: p03-config
          env:
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: {name: p03-secrets, key: MYSQL_PASSWORD}
            - name: DATABASE_URL
              value: mysql+pymysql://p03_app:$(MYSQL_PASSWORD)@p03-mysql:3306/p03
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: p03-secrets, key: JWT_SECRET_KEY}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: uploads, mountPath: /app/backend/uploads}
      volumes:
        - name: uploads
          emptyDir: {}
---
