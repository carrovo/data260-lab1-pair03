# Kafka consumers. They have no HTTP port, so no probes: Kubernetes restarts
# the pod if the process exits.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p03-job-index-worker
  labels:
    app.kubernetes.io/name: p03-job-index-worker
    app.kubernetes.io/part-of: p03
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: p03-job-index-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: p03-job-index-worker
        app.kubernetes.io/part-of: p03
    spec:
      containers:
        - name: worker
          image: p03-worker:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: p03-config
          env:
            - name: WORKER_NAME
              value: job-index-worker
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 300m, memory: 256Mi}
