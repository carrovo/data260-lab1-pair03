# Gateway + static site. Service names resolve through Compose / Kubernetes DNS.
# Regex locations are checked in order and beat the "/" fallback, so the more
# specific routes come first.
server {
    listen 9036;
    root /usr/share/nginx/html;
    client_max_body_size 10m;          # resume uploads

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;           # the assistant waits on a local LLM

    location = /healthz { access_log off; return 200 "ok\n"; }

    # ---- company side (axios client, paths start with /api/companies)
    location ~ ^/api/companies/jobs/[^/]+/applicants {
        proxy_pass http://p03-company-service:9030;
    }
    location ~ ^/api/companies/jobs   { proxy_pass http://p03-job-service:9032; }
    location ~ ^/api/companies/events { proxy_pass http://p03-event-service:9034; }
    location ~ ^/api/                 { proxy_pass http://p03-company-service:9030; }

    # ---- student side (fetch client, prefix /gw is removed before forwarding)
    location ~ ^/gw/jobs/[^/]+/applications {
        rewrite ^/gw(/.*)$ $1 break;
        proxy_pass http://p03-application-service:9033;
    }
    location ~ ^/gw/applications {
        rewrite ^/gw(/.*)$ $1 break;
        proxy_pass http://p03-application-service:9033;
    }
    location ~ ^/gw/jobs {
        rewrite ^/gw(/.*)$ $1 break;
        proxy_pass http://p03-job-service:9032;
    }
    location ~ ^/gw/(events|registrations) {
        rewrite ^/gw(/.*)$ $1 break;
        proxy_pass http://p03-event-service:9034;
    }
    location ~ ^/gw/auth {
        rewrite ^/gw(/.*)$ $1 break;
        proxy_pass http://p03-student-service:9031;
    }
    location ~ ^/gw/assistant {
        rewrite ^/gw(/.*)$ $1 break;
        proxy_pass http://p03-assistant-service:9035;
    }

    # ---- the React app (client-side routes fall back to index.html)
    location / {
        try_files $uri /index.html;
    }
}
