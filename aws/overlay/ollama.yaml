# Ollama model server for the Assistant on EKS (CPU only; the cluster has no GPU nodes).
# AWS only: the local Kubernetes setup keeps using Ollama on the host (k8s/student-services.yaml).
# The model is stored on an EBS volume, so it is downloaded once and survives a pause/resume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: p03-ollama-models
  namespace: p03
  labels:
    app.kubernetes.io/name: p03-ollama
    app.kubernetes.io/part-of: p03
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 30Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p03-ollama
  namespace: p03
  labels:
    app.kubernetes.io/name: p03-ollama
    app.kubernetes.io/part-of: p03
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: p03-ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: p03-ollama
        app.kubernetes.io/part-of: p03
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - name: http
              containerPort: 11434
          env:
            - {name: OLLAMA_KEEP_ALIVE, value: "30m"}
          volumeMounts:
            - {name: models, mountPath: /root/.ollama}
          readinessProbe:
            httpGet: {path: /api/tags, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: {cpu: "2", memory: 7Gi}
            limits: {memory: 12Gi}
      volumes:
        - name: models
          persistentVolumeClaim: {claimName: p03-ollama-models}
---
apiVersion: v1
kind: Service
metadata:
  name: p03-ollama
  namespace: p03
  labels:
    app.kubernetes.io/name: p03-ollama
    app.kubernetes.io/part-of: p03
spec:
  selector:
    app.kubernetes.io/name: p03-ollama
  ports:
    - {name: http, port: 11434, targetPort: http}
---
# One-time download of the model into the volume (a no-op on later runs).
apiVersion: batch/v1
kind: Job
metadata:
  name: p03-ollama-pull
  namespace: p03
  labels:
    app.kubernetes.io/name: p03-ollama-pull
    app.kubernetes.io/part-of: p03
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: pull
          image: ollama/ollama:latest
          env:
            - {name: OLLAMA_HOST, value: "http://p03-ollama:11434"}
          command:
            - sh
            - -c
            - until ollama list >/dev/null 2>&1; do sleep 5; done; ollama pull qwen3:8b; ollama list
